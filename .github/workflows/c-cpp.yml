name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: install ISPC
      uses: ispc/install-ispc-action@main
    - uses: actions/checkout@v4
    - name: make
      run: make -f Makefile.linux
    - name: make check
      run: make -f Makefile.linux check
    - name: make distcheck
      run: make -f Makefile.linux distcheck
