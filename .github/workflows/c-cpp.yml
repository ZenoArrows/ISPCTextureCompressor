name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: install ISPC
      uses: ispc/install-ispc-action@main
    - name: make
      run: make -f Makefile.linux
    - name: Upload Library Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ispc_texcomp
        path: build/libispc_texcomp.so
        retention-days: 7
        archive: false
